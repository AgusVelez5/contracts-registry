[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
futures = "0.3"
tower-http = { version = "0.5", features = ["cors", "catch-panic"] }
alloy-dyn-abi = "0.8"
alloy-json-abi = "0.8"
hex = "0.4"
rust-embed = { version = "8", optional = true }
axum-embed = { version = "0.1", optional = true }

[features]
embed-frontend = ["dep:rust-embed", "dep:axum-embed"]